<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NyoNyo AI — Pengingat!</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0eeff;
      color: #2d2d4e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    /* ── Stage colour themes ── */
    body.stage-1 { background: linear-gradient(160deg, #f0eeff 0%, #e8f8f5 100%); }
    body.stage-2 { background: linear-gradient(160deg, #fff0f6 0%, #f0eeff 100%); }
    body.stage-3 { background: linear-gradient(160deg, #fff0dd 0%, #ffe0ee 100%); }

    .reminder-card {
      background: #fff;
      border-radius: 28px;
      padding: 36px 32px 28px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 8px 40px rgba(123,111,212,0.14);
      text-align: center;
      position: relative;
    }

    /* ── Bot container ── */
    .bot-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: 20px;
    }
    #nyonyo-bot {
      width: 120px;
      height: 132px;
      filter: drop-shadow(0 8px 18px rgba(123,111,212,0.3));
    }
    #nyonyo-bot.float  { animation: float 3.2s ease-in-out infinite; }
    #nyonyo-bot.bounce { animation: bounce 0.45s ease-in-out 4, float 3.2s ease-in-out infinite 1.8s; }
    #nyonyo-bot.rage   { animation: rage 0.3s ease-in-out 6, float 3.2s ease-in-out infinite 1.8s; }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%     { transform: translateY(-12px); }
    }
    @keyframes bounce {
      0%   { transform: translateY(0) scale(1); }
      25%  { transform: translateY(-18px) rotate(-9deg) scale(1.1); }
      50%  { transform: translateY(-6px) rotate(9deg) scale(1.06); }
      75%  { transform: translateY(-14px) rotate(-5deg) scale(1.1); }
      100% { transform: translateY(0) rotate(0) scale(1); }
    }
    @keyframes rage {
      0%   { transform: translateX(0) rotate(0); }
      20%  { transform: translateX(-8px) rotate(-6deg) scale(1.08); }
      40%  { transform: translateX(8px) rotate(6deg) scale(1.08); }
      60%  { transform: translateX(-6px) rotate(-4deg); }
      80%  { transform: translateX(6px) rotate(4deg); }
      100% { transform: translateX(0) rotate(0); }
    }

    /* Eye blink */
    .bot-eye-l, .bot-eye-r {
      animation: blink 4s ease-in-out infinite;
    }
    .bot-eye-r { animation-delay: 0.12s; }
    @keyframes blink {
      0%,94%,100% { transform: scaleY(1); }
      96%         { transform: scaleY(0.07); }
    }
    /* Stage-3 angry brow lines */
    .angry-brow { display: none; }
    body.stage-3 .angry-brow { display: block; }
    body.stage-3 .happy-mouth { display: none; }
    .angry-mouth { display: none; }
    body.stage-3 .angry-mouth { display: block; }
    /* Stage-2 concerned brow */
    .concern-brow { display: none; }
    body.stage-2 .concern-brow { display: block; }

    /* ── Speech bubble ── */
    .speech-bubble {
      background: #f5f3ff;
      border: 2px solid #c5bdf8;
      border-radius: 20px 20px 20px 4px;
      padding: 16px 20px;
      margin-bottom: 22px;
      font-size: 1rem;
      line-height: 1.65;
      color: #3d3480;
      font-weight: 600;
      text-align: left;
      white-space: pre-line;
    }
    body.stage-2 .speech-bubble {
      border-color: #f7a8c0;
      background: #fff5f8;
      color: #7b2050;
    }
    body.stage-3 .speech-bubble {
      border-color: #f0a040;
      background: #fff8ee;
      color: #7a3800;
    }

    /* ── Activity badge ── */
    .activity-badge {
      display: inline-block;
      background: linear-gradient(135deg, #7b6fd4, #5bc8c8);
      color: #fff;
      border-radius: 30px;
      padding: 6px 20px;
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 24px;
      letter-spacing: 0.2px;
    }

    /* ── Buttons ── */
    .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

    .btn {
      border: none;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 12px 26px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.96); }
    .btn:hover  { opacity: 0.87; }

    .btn-start {
      background: linear-gradient(135deg, #7b6fd4, #5bc8c8);
      color: #fff;
    }
    .btn-snooze {
      background: #f5f3ff;
      color: #5a4fb0;
      border: 2px solid #d4ceff;
    }
    .btn-close {
      background: #ffe4ef;
      color: #c0366a;
    }

    /* ── Timestamp ── */
    .timestamp {
      margin-top: 18px;
      font-size: 0.78rem;
      color: #a09ace;
    }

    /* ── Stage badge ── */
    .stage-badge {
      position: absolute;
      top: 16px;
      right: 18px;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      background: #ede9ff;
      color: #6b5ecc;
    }
    body.stage-2 .stage-badge { background: #ffe0ec; color: #c0366a; }
    body.stage-3 .stage-badge { background: #ffe8c8; color: #a05000; }
  </style>
</head>
<body>

<div class="reminder-card">
  <span class="stage-badge" id="stage-badge">Pengingat ke-1</span>

  <!-- NyoNyo SVG character -->
  <div class="bot-wrap">
    <svg id="nyonyo-bot" class="float" viewBox="0 0 100 110"
         xmlns="http://www.w3.org/2000/svg" aria-label="NyoNyo AI" role="img">
      <!-- Antenna -->
      <line x1="50" y1="12" x2="50" y2="24" stroke="#a0d8b0" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="50" cy="9" rx="6" ry="7" fill="#6fcf97"/>
      <ellipse cx="45" cy="6" rx="4" ry="3" fill="#a8e6c1" transform="rotate(-20 45 6)"/>
      <ellipse cx="55" cy="6" rx="4" ry="3" fill="#a8e6c1" transform="rotate(20 55 6)"/>
      <!-- Head -->
      <rect x="22" y="22" width="56" height="48" rx="18" fill="#c9c4f7"/>
      <ellipse cx="38" cy="30" rx="8" ry="4" fill="#e8e5ff" opacity="0.6"/>
      <!-- Eye sockets -->
      <ellipse cx="38" cy="44" rx="9" ry="10" fill="#fff"/>
      <ellipse cx="62" cy="44" rx="9" ry="10" fill="#fff"/>
      <!-- Pupils -->
      <ellipse class="bot-eye-l" cx="38" cy="44" rx="5" ry="5.5" fill="#6b5ecc"
               style="transform-origin:38px 44px;"/>
      <ellipse class="bot-eye-r" cx="62" cy="44" rx="5" ry="5.5" fill="#6b5ecc"
               style="transform-origin:62px 44px;"/>
      <circle cx="40" cy="42" r="1.8" fill="#fff"/>
      <circle cx="64" cy="42" r="1.8" fill="#fff"/>
      <!-- Blush -->
      <ellipse cx="28" cy="54" rx="6" ry="3.5" fill="#f7b8d0" opacity="0.7"/>
      <ellipse cx="72" cy="54" rx="6" ry="3.5" fill="#f7b8d0" opacity="0.7"/>
      <!-- Stage-2 concerned brows -->
      <line class="concern-brow" x1="31" y1="36" x2="44" y2="38" stroke="#9070cc"
            stroke-width="2.2" stroke-linecap="round"/>
      <line class="concern-brow" x1="56" y1="38" x2="69" y2="36" stroke="#9070cc"
            stroke-width="2.2" stroke-linecap="round"/>
      <!-- Stage-3 angry brows -->
      <line class="angry-brow" x1="30" y1="38" x2="45" y2="34" stroke="#c05000"
            stroke-width="2.5" stroke-linecap="round"/>
      <line class="angry-brow" x1="55" y1="34" x2="70" y2="38" stroke="#c05000"
            stroke-width="2.5" stroke-linecap="round"/>
      <!-- Mouth: happy (stages 1-2) -->
      <path class="happy-mouth"
            d="M 40 58 Q 50 66 60 58"
            stroke="#7b6fd4" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- Mouth: angry (stage 3) -->
      <path class="angry-mouth"
            d="M 40 63 Q 50 57 60 63"
            stroke="#c05000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- Body -->
      <rect x="30" y="68" width="40" height="30" rx="14" fill="#b8b0f0"/>
      <rect x="38" y="74" width="24" height="16" rx="7" fill="#d8d4ff"/>
      <circle cx="50" cy="82" r="4" fill="#5bc8c8" opacity="0.8"/>
      <!-- Arms -->
      <rect x="10" y="70" width="22" height="12" rx="6" fill="#c9c4f7"/>
      <rect x="68" y="70" width="22" height="12" rx="6" fill="#c9c4f7"/>
      <circle cx="14" cy="76" r="6" fill="#b8b0f0"/>
      <circle cx="86" cy="76" r="6" fill="#b8b0f0"/>
      <!-- Feet -->
      <ellipse cx="40" cy="100" rx="9" ry="5" fill="#b8b0f0"/>
      <ellipse cx="60" cy="100" rx="9" ry="5" fill="#b8b0f0"/>
    </svg>
  </div>

  <div class="activity-badge" id="activity-badge">📌 Memuat…</div>

  <div class="speech-bubble" id="speech-bubble">…</div>

  <div class="btn-row">
    <button class="btn btn-start"  id="btn-start">✅ Mulai Sekarang!</button>
    <button class="btn btn-snooze" id="btn-snooze">⏰ Nanti 5 Menit</button>
    <button class="btn btn-close"  id="btn-close">✖ Tutup</button>
  </div>

  <div class="timestamp" id="timestamp"></div>
</div>

<script src="reminder.js"></script>
</body>
</html>
